<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BC Extractor</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --accent:   #6366F1;
    --accent-h: #4F46E5;
    --accent-bg:#EEF2FF;
    --bg:       #F4F4F6;
    --card:     #FFFFFF;
    --border:   #E4E4E7;
    --text:     #18181B;
    --sub:      #71717A;
    --green:    #22C55E;
    --red:      #EF4444;
    --shadow:   0 1px 3px rgba(0,0,0,.07), 0 1px 2px rgba(0,0,0,.04);
    --radius:   12px;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px 16px 60px;
  }

  .shell {
    width: 100%;
    max-width: 640px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  /* ── Header ── */
  .app-header {
    padding: 4px 2px 12px;
    display: flex;
    align-items: baseline;
    gap: 10px;
  }
  .app-header h1 {
    font-size: 1.15rem;
    font-weight: 700;
    letter-spacing: -.4px;
    color: var(--text);
  }
  .app-header span {
    font-size: .8rem;
    color: var(--sub);
  }

  /* ── Card ── */
  .card {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 18px 20px;
  }
  .section-label {
    font-size: .68rem;
    font-weight: 600;
    letter-spacing: .07em;
    text-transform: uppercase;
    color: var(--sub);
    margin-bottom: 12px;
  }

  /* ── Drop zone ── */
  .dz {
    border: 1.5px dashed var(--border);
    border-radius: 10px;
    padding: 28px 16px;
    text-align: center;
    transition: border-color .15s, background .15s;
    cursor: default;
  }
  .dz.over {
    border-color: var(--accent);
    background: var(--accent-bg);
  }
  .dz-icon { font-size: 1.6rem; margin-bottom: 7px; opacity: .7; }
  .dz-text { font-size: .88rem; color: var(--sub); }

  /* ── Picker buttons ── */
  .picker-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-top: 10px;
  }
  .picker-btn {
    display: flex; align-items: center; justify-content: center; gap: 6px;
    padding: 8px 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--card);
    font-size: .84rem;
    font-weight: 500;
    color: var(--sub);
    cursor: pointer;
    transition: all .15s;
  }
  .picker-btn:hover {
    border-color: var(--accent);
    color: var(--accent);
    background: var(--accent-bg);
  }

  /* ── File chips ── */
  .file-list { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .chip {
    display: flex; align-items: center; gap: 5px;
    padding: 3px 8px 3px 10px;
    background: var(--accent-bg);
    border: 1px solid #C7D2FE;
    border-radius: 999px;
    font-size: .78rem;
    font-weight: 500;
    color: var(--accent);
  }
  .chip button {
    background: none; border: none; cursor: pointer;
    color: #A5B4FC; font-size: .8rem; line-height: 1; padding: 0;
    display: flex; align-items: center;
  }
  .chip button:hover { color: var(--red); }

  /* ── Options ── */
  .opt-row {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 12px;
  }
  .opt-row:last-child { margin-bottom: 0; }
  .opt-row label {
    font-size: .84rem;
    font-weight: 500;
    color: var(--sub);
    white-space: nowrap;
    min-width: 82px;
  }
  .opt-row input[type=text] {
    flex: 1;
    padding: 7px 11px;
    border: 1px solid var(--border);
    border-radius: 7px;
    font-size: .85rem;
    color: var(--text);
    outline: none;
    transition: border-color .15s;
    background: var(--bg);
  }
  .opt-row input[type=text]:focus { border-color: var(--accent); background: #fff; }

  .checks { display: flex; flex-direction: column; gap: 9px; margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--border); }
  .check-row {
    display: flex; align-items: center; gap: 9px;
    cursor: pointer; user-select: none;
    font-size: .84rem; font-weight: 500; color: var(--sub);
  }
  .check-row input[type=checkbox] {
    width: 15px; height: 15px;
    accent-color: var(--accent);
    cursor: pointer; flex-shrink: 0;
  }
  .check-row:hover { color: var(--text); }

  /* ── Actions ── */
  .action-bar {
    display: flex;
    gap: 8px;
    align-items: center;
  }
  .btn {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 9px 20px;
    border: none; border-radius: 8px;
    font-size: .88rem; font-weight: 600;
    cursor: pointer; transition: background .15s, opacity .15s;
  }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:hover:not(:disabled) { background: var(--accent-h); }
  .btn-primary:disabled { opacity: .4; cursor: not-allowed; }
  .btn-ghost { background: var(--bg); color: var(--sub); border: 1px solid var(--border); }
  .btn-ghost:hover { color: var(--text); border-color: #A1A1AA; }

  /* ── Progress ── */
  .progress-wrap { display: none; margin-top: 12px; }
  .progress-wrap.visible { display: block; }
  .progress-bg { height: 3px; background: var(--border); border-radius: 999px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--accent); border-radius: 999px; transition: width .25s; width: 0%; }
  .progress-text { font-size: .75rem; color: var(--sub); margin-top: 5px; }

  /* ── Success banner ── */
  #dl-section { display: none; }
  #dl-section.visible { display: flex; }
  .dl-banner {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    flex-wrap: wrap;
    background: #F0FDF4;
    border: 1px solid #BBF7D0;
    border-radius: 10px;
    padding: 13px 16px;
  }
  .dl-banner .dl-msg { font-size: .88rem; font-weight: 600; color: #15803D; }
  .dl-banner .dl-sub { font-size: .76rem; color: var(--sub); margin-top: 2px; }

  /* ── Log ── */
  .log-card { padding: 0; overflow: hidden; }
  .log-bar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 8px 14px;
    border-bottom: 1px solid #27272A;
    background: #1C1C1F;
  }
  .log-bar span { font-size: .7rem; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; color: #52525B; }
  .log-bar button { background: none; border: none; font-size: .75rem; color: #52525B; cursor: pointer; }
  .log-bar button:hover { color: #A1A1AA; }
  #log {
    font-family: "Menlo", "Consolas", monospace;
    font-size: .78rem;
    line-height: 1.65;
    padding: 10px 14px;
    height: 200px;
    overflow-y: auto;
    background: #111113;
    color: #A1A1AA;
    white-space: pre-wrap;
    word-break: break-all;
  }
  #log .ok    { color: #4ADE80; }
  #log .err   { color: #F87171; }
  #log .head  { color: #818CF8; font-weight: 600; }
  #log .muted { color: #3F3F46; }

  /* ── Spinner ── */
  @keyframes spin { to { transform: rotate(360deg); } }
  .spinner {
    width: 14px; height: 14px;
    border: 2px solid rgba(255,255,255,.3);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin .7s linear infinite;
    flex-shrink: 0;
  }

  @media (max-width: 480px) {
    body { padding: 20px 12px 48px; }
    .card { padding: 14px 16px; }
  }
</style>
</head>
<body>
<div class="shell">

  <div class="app-header">
    <h1>BC Extractor</h1>
    <span>Canvas submission renamer</span>
  </div>

  <!-- Source -->
  <div class="card">
    <div class="section-label" id="source-label">Source</div>
    <div class="dz" id="dropzone">
      <div class="dz-icon">📦</div>
      <div class="dz-text" id="dz-label">Drop ZIP</div>
    </div>
    <input type="file" id="file-input"   accept=".zip" multiple style="display:none">
    <input type="file" id="folder-input" style="display:none" webkitdirectory>
    <div class="picker-row">
      <button class="picker-btn" onclick="document.getElementById('file-input').click()">
        📄 Select file(s)
      </button>
      <button class="picker-btn" onclick="document.getElementById('folder-input').click()">
        📁 Select folder
      </button>
    </div>
    <div class="file-list" id="file-list"></div>
  </div>

  <!-- Options -->
  <div class="card">
    <div class="section-label">Options</div>
    <div class="opt-row">
      <label for="basename">Base name</label>
      <input type="text" id="basename" placeholder="default: ZIP filename">
    </div>
    <div class="checks">
      <label class="check-row">
        <input type="checkbox" id="opt-lowercase" checked>
        Lowercase
      </label>
      <label class="check-row">
        <input type="checkbox" id="opt-nonumbers">
        Numbers
      </label>
    </div>
  </div>

  <!-- Actions -->
  <div class="card">
    <div class="action-bar">
      <button class="btn btn-primary" id="run-btn" onclick="run()" disabled>
        ⚙&thinsp; Process &amp; Download
      </button>
      <button class="btn btn-ghost" onclick="reset()">Clear</button>
    </div>
    <div class="progress-wrap" id="progress-wrap">
      <div class="progress-bg"><div class="progress-fill" id="progress-fill"></div></div>
      <div class="progress-text" id="progress-text"></div>
    </div>
  </div>

  <!-- Success -->
  <div id="dl-section">
    <div class="dl-banner">
      <div>
        <div class="dl-msg" id="dl-msg">Done</div>
        <div class="dl-sub" id="dl-sub"></div>
      </div>
      <button class="btn btn-primary" id="dl-btn">⬇ Download again</button>
    </div>
  </div>

  <!-- Log -->
  <div class="card log-card">
    <div class="log-bar">
      <span>Output</span>
      <button onclick="clearLog()">Clear</button>
    </div>
    <div id="log"></div>
  </div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"
        integrity="sha512-XMVd28F1oH/O71fzwBnV7HucLxVwtxf26XV8P4wPk26EDxuGZ91N8bsOttmnomcCD3CS5ZMRL50H0GgOHvegtg=="
        crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script>
let selectedFiles = [];

const dropzone    = document.getElementById('dropzone');
const fileInput   = document.getElementById('file-input');
const folderInput = document.getElementById('folder-input');

fileInput.addEventListener('change', e => { addFiles([...e.target.files]); e.target.value = ''; });

folderInput.addEventListener('change', e => {
  // Only keep ZIPs directly in the selected folder (webkitRelativePath = "folder/file.zip" → 1 slash)
  const zips = [...e.target.files].filter(f =>
    f.name.toLowerCase().endsWith('.zip') &&
    (f.webkitRelativePath.match(/\//g) || []).length === 1
  );
  if (!zips.length) logLine('No ZIP files found at the top level of the selected folder.', 'err');
  else addFiles(zips);
  e.target.value = '';
});

dropzone.addEventListener('dragover',  e => { e.preventDefault(); dropzone.classList.add('over'); });
dropzone.addEventListener('dragleave', e => { if (!dropzone.contains(e.relatedTarget)) dropzone.classList.remove('over'); });
dropzone.addEventListener('drop', e => {
  e.preventDefault();
  dropzone.classList.remove('over');
  addFiles([...e.dataTransfer.files].filter(f => f.name.toLowerCase().endsWith('.zip')));
});

function addFiles(files) {
  const zips = files.filter(f => f.name.toLowerCase().endsWith('.zip'));
  if (!zips.length) { logLine('No .zip files in selection.', 'err'); return; }
  const existing = new Set(selectedFiles.map(f => f.name));
  zips.forEach(f => { if (!existing.has(f.name)) selectedFiles.push(f); });
  renderFileList();
  updateRunBtn();
}

function removeFile(name) {
  selectedFiles = selectedFiles.filter(f => f.name !== name);
  renderFileList();
  updateRunBtn();
}

function renderFileList() {
  document.getElementById('file-list').innerHTML = selectedFiles.map(f => `
    <div class="chip">
      ${escHtml(f.name)}
      <button title="Remove" onclick="removeFile('${escHtml(f.name).replace(/'/g,"\\'")}')">✕</button>
    </div>`).join('');
}

function updateRunBtn() {
  document.getElementById('run-btn').disabled = selectedFiles.length === 0;
}

function extractLastname(folderName) {
  if (!folderName) return '';
  const firstSegment = folderName.split('_')[0].trim();
  const words = firstSegment.split(/\s+/);
  return words[words.length - 1];
}

async function processZip(file, basename, noLastname, lowercase, logPrefix) {
  const prefix = logPrefix ? logPrefix + ' ' : '';
  logLine(`${prefix}${file.name}`, 'head');
  let zip;
  try { zip = await JSZip.loadAsync(file); }
  catch(e) { logLine(`  ✗ ${e.message}`, 'err'); return []; }

  const members = Object.values(zip.files).filter(f => !f.dir);
  if (!members.length) { logLine('  No files found.', 'err'); return []; }

  const effectiveBase = (basename && basename.trim()) ? basename.trim()
                      : file.name.replace(/\.zip$/i, '');
  const lastnameCount = {};
  let fileCount = 1;
  const results = [];

  for (const member of members) {
    const parts    = member.name.split('/');
    const fname    = parts[parts.length - 1];
    const folder   = parts.length > 1 ? parts[parts.length - 2] : '';
    const ext      = fname.includes('.') ? '.' + fname.split('.').pop() : '';
    const lastname = extractLastname(folder);

    let newName;
    if (noLastname || !lastname) {
      newName = `${effectiveBase}-${String(fileCount).padStart(2,'0')}${ext}`;
      fileCount++;
    } else {
      lastnameCount[lastname] = (lastnameCount[lastname] || 0) + 1;
      newName = lastnameCount[lastname] === 1
        ? `${effectiveBase}-${lastname}${ext}`
        : `${effectiveBase}-${lastname}-${lastnameCount[lastname]}${ext}`;
    }
    if (lowercase) newName = newName.toLowerCase();

    const blob = await member.async('blob');
    results.push({ name: newName, blob });
    logLine(`  → ${newName}`, 'ok');
  }
  return results;
}

async function run() {
  if (!selectedFiles.length) return;
  const basename   = document.getElementById('basename').value;
  const lowercase  = document.getElementById('opt-lowercase').checked;
  const noLastname = document.getElementById('opt-nonumbers').checked;

  const runBtn = document.getElementById('run-btn');
  runBtn.disabled = true;
  runBtn.innerHTML = '<div class="spinner"></div> Processing…';
  setProgress(true, 0, 'Starting…');
  document.getElementById('dl-section').classList.remove('visible');

  logLine('─'.repeat(44), 'muted');

  const outputZip = new JSZip();
  let totalOk = 0;

  for (let i = 0; i < selectedFiles.length; i++) {
    const file = selectedFiles[i];
    setProgress(true, Math.round((i / selectedFiles.length) * 100),
      `${i+1} / ${selectedFiles.length} — ${file.name}`);

    const prefix  = selectedFiles.length > 1 ? `[${i+1}/${selectedFiles.length}]` : '';
    const results = await processZip(file, basename, noLastname, lowercase, prefix);
    const folder  = selectedFiles.length > 1
      ? outputZip.folder(file.name.replace(/\.zip$/i, ''))
      : outputZip;
    results.forEach(r => { folder.file(r.name, r.blob); totalOk++; });
  }

  setProgress(true, 100, 'Building archive…');
  const outBlob = await outputZip.generateAsync({ type: 'blob' });
  const outName = selectedFiles.length === 1
    ? selectedFiles[0].name.replace(/\.zip$/i, '-extracted.zip')
    : 'extracted-files.zip';

  document.getElementById('dl-btn').onclick = () => downloadBlob(outBlob, outName);
  document.getElementById('dl-msg').textContent = `${totalOk} file(s) extracted from ${selectedFiles.length} ZIP(s)`;
  document.getElementById('dl-sub').textContent  = outName;
  document.getElementById('dl-section').classList.add('visible');

  downloadBlob(outBlob, outName);
  logLine(`\n${totalOk} file(s) done.`, 'ok');
  setProgress(false);
  runBtn.disabled = false;
  runBtn.innerHTML = '⚙&thinsp; Process & Download';
}

function downloadBlob(blob, filename) {
  const url = URL.createObjectURL(blob);
  const a = Object.assign(document.createElement('a'), { href: url, download: filename });
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 5000);
}

function setProgress(visible, pct, text) {
  document.getElementById('progress-wrap').classList.toggle('visible', visible);
  if (visible) {
    document.getElementById('progress-fill').style.width = pct + '%';
    document.getElementById('progress-text').textContent = text || '';
  }
}

function logLine(msg, cls) {
  const log  = document.getElementById('log');
  const line = document.createElement('div');
  if (cls) line.className = cls;
  line.textContent = msg;
  log.appendChild(line);
  log.scrollTop = log.scrollHeight;
}

function clearLog() { document.getElementById('log').innerHTML = ''; }

function reset() {
  selectedFiles = [];
  renderFileList();
  updateRunBtn();
  clearLog();
  document.getElementById('basename').value = '';
  document.getElementById('opt-lowercase').checked = true;
  document.getElementById('opt-nonumbers').checked = false;
  document.getElementById('dl-section').classList.remove('visible');
  setProgress(false);
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
</script>
</body>
</html>
