<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Photo Date Renamer</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --accent:   #6366F1;
    --accent-h: #4F46E5;
    --accent-bg:#EEF2FF;
    --bg:       #F4F4F6;
    --card:     #FFFFFF;
    --border:   #E4E4E7;
    --text:     #18181B;
    --sub:      #71717A;
    --green:    #22C55E;
    --red:      #EF4444;
    --shadow:   0 1px 3px rgba(0,0,0,.07), 0 1px 2px rgba(0,0,0,.04);
    --radius:   12px;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px 16px 60px;
  }

  .shell { width: 100%; max-width: 640px; display: flex; flex-direction: column; gap: 12px; }

  .app-header { padding: 4px 2px 12px; display: flex; align-items: baseline; gap: 10px; }
  .app-header h1 { font-size: 1.15rem; font-weight: 700; letter-spacing: -.4px; color: var(--text); }
  .app-header span { font-size: .8rem; color: var(--sub); }

  .card { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); padding: 18px 20px; }
  .section-label { font-size: .68rem; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; color: var(--sub); margin-bottom: 12px; }

  .dz {
    border: 1.5px dashed var(--border); border-radius: 10px; padding: 28px 16px;
    text-align: center; transition: border-color .15s, background .15s; cursor: default;
  }
  .dz.over { border-color: var(--accent); background: var(--accent-bg); }
  .dz-icon { font-size: 1.6rem; margin-bottom: 7px; opacity: .7; }
  .dz-text { font-size: .88rem; color: var(--sub); }

  .picker-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
  .picker-btn {
    display: flex; align-items: center; justify-content: center; gap: 6px;
    padding: 8px 12px; border: 1px solid var(--border); border-radius: 8px;
    background: var(--card); font-size: .84rem; font-weight: 500; color: var(--sub);
    cursor: pointer; transition: all .15s;
  }
  .picker-btn:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-bg); }

  .file-list { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .chip {
    display: flex; align-items: center; gap: 5px;
    padding: 3px 8px 3px 10px; background: var(--accent-bg); border: 1px solid #C7D2FE;
    border-radius: 999px; font-size: .78rem; font-weight: 500; color: var(--accent);
  }
  .chip button { background: none; border: none; cursor: pointer; color: #A5B4FC; font-size: .8rem; line-height: 1; padding: 0; display: flex; align-items: center; }
  .chip button:hover { color: var(--red); }

  .opt-row { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
  .opt-row:last-child { margin-bottom: 0; }
  .opt-row label { font-size: .84rem; font-weight: 500; color: var(--sub); white-space: nowrap; min-width: 90px; }
  .opt-row input[type=text] {
    flex: 1; padding: 7px 11px; border: 1px solid var(--border); border-radius: 7px;
    font-size: .85rem; color: var(--text); outline: none; transition: border-color .15s; background: var(--bg);
  }
  .opt-row input[type=text]:focus { border-color: var(--accent); background: #fff; }

  .seg-group { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  .seg-btn {
    padding: 6px 14px; font-size: .82rem; font-weight: 500; background: none; border: none;
    color: var(--sub); cursor: pointer; border-right: 1px solid var(--border); transition: all .15s;
  }
  .seg-btn:last-child { border-right: none; }
  .seg-btn.active { background: var(--accent); color: #fff; }
  .seg-btn:hover:not(.active) { background: var(--accent-bg); color: var(--accent); }

  .custom-name-row { display: none; align-items: center; gap: 12px; margin-top: 10px; }
  .custom-name-row.visible { display: flex; }

  .checks { display: flex; flex-direction: column; gap: 9px; margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--border); }
  .check-row { display: flex; align-items: center; gap: 9px; cursor: pointer; user-select: none; font-size: .84rem; font-weight: 500; color: var(--sub); }
  .check-row input[type=checkbox] { width: 15px; height: 15px; accent-color: var(--accent); cursor: pointer; flex-shrink: 0; }
  .check-row:hover { color: var(--text); }

  .action-bar { display: flex; gap: 8px; align-items: center; }
  .btn {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 9px 20px; border: none; border-radius: 8px;
    font-size: .88rem; font-weight: 600; cursor: pointer; transition: background .15s, opacity .15s;
  }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:hover:not(:disabled) { background: var(--accent-h); }
  .btn-primary:disabled { opacity: .4; cursor: not-allowed; }
  .btn-ghost { background: var(--bg); color: var(--sub); border: 1px solid var(--border); }
  .btn-ghost:hover { color: var(--text); border-color: #A1A1AA; }

  .progress-wrap { display: none; margin-top: 12px; }
  .progress-wrap.visible { display: block; }
  .progress-bg { height: 3px; background: var(--border); border-radius: 999px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--accent); border-radius: 999px; transition: width .25s; width: 0%; }
  .progress-text { font-size: .75rem; color: var(--sub); margin-top: 5px; }

  #dl-section { display: none; }
  #dl-section.visible { display: flex; }
  .dl-banner {
    display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
    background: #F0FDF4; border: 1px solid #BBF7D0; border-radius: 10px; padding: 13px 16px;
  }
  .dl-banner .dl-msg { font-size: .88rem; font-weight: 600; color: #15803D; }
  .dl-banner .dl-sub { font-size: .76rem; color: var(--sub); margin-top: 2px; }

  .log-card { padding: 0; overflow: hidden; }
  .log-bar { display: flex; align-items: center; justify-content: space-between; padding: 8px 14px; border-bottom: 1px solid #27272A; background: #1C1C1F; }
  .log-bar span { font-size: .7rem; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; color: #52525B; }
  .log-bar button { background: none; border: none; font-size: .75rem; color: #52525B; cursor: pointer; }
  .log-bar button:hover { color: #A1A1AA; }
  #log {
    font-family: "Menlo", "Consolas", monospace; font-size: .78rem; line-height: 1.65;
    padding: 10px 14px; height: 220px; overflow-y: auto;
    background: #111113; color: #A1A1AA; white-space: pre-wrap; word-break: break-all;
  }
  #log .ok    { color: #4ADE80; }
  #log .err   { color: #F87171; }
  #log .head  { color: #818CF8; font-weight: 600; }
  #log .muted { color: #3F3F46; }

  @keyframes spin { to { transform: rotate(360deg); } }
  .spinner { width: 14px; height: 14px; border: 2px solid rgba(255,255,255,.3); border-top-color: #fff; border-radius: 50%; animation: spin .7s linear infinite; flex-shrink: 0; }

  @media (max-width: 480px) { body { padding: 20px 12px 48px; } .card { padding: 14px 16px; } }

  .back-nav { display:inline-flex; align-items:center; gap:5px; font-size:.78rem; font-weight:600; color:var(--sub); text-decoration:none; padding:4px 0 0; }
  .back-nav:hover { color:var(--accent); }
  .back-nav::before { content:"←"; }
</style>
</head>
<body>
<div class="shell">

  <a class="back-nav" href="../../index.html">All tools</a>

  <div class="app-header">
    <h1>Photo Date Renamer</h1>
    <span>rename images using EXIF date</span>
  </div>

  <!-- Images -->
  <div class="card">
    <div class="section-label">Images</div>
    <div class="dz" id="dropzone">
      <div class="dz-icon">🖼️</div>
      <div class="dz-text">Drop JPG / PNG files or a folder here</div>
    </div>
    <input type="file" id="file-input" accept=".jpg,.jpeg,.png" multiple style="display:none">
    <input type="file" id="folder-input" style="display:none" webkitdirectory>
    <div class="picker-row">
      <button class="picker-btn" onclick="document.getElementById('file-input').click()">📄 Select file(s)</button>
      <button class="picker-btn" onclick="document.getElementById('folder-input').click()">📁 Select folder</button>
    </div>
    <div class="file-list" id="file-list"></div>
  </div>

  <!-- Options -->
  <div class="card">
    <div class="section-label">Options</div>

    <div class="opt-row">
      <label>Separator</label>
      <input type="text" id="opt-separator" value="_" style="max-width:80px">
    </div>

    <div class="opt-row" style="flex-direction:column; align-items:flex-start; gap:8px;">
      <label>Name base</label>
      <div class="seg-group" id="name-mode-group" style="width:100%; display:flex;">
        <button class="seg-btn active" onclick="setNameMode('keep')" style="flex:1;">Keep original</button>
        <button class="seg-btn" onclick="setNameMode('custom')" style="flex:1;">Custom</button>
        <button class="seg-btn" onclick="setNameMode('date')" style="flex:1;">Date only</button>
      </div>
    </div>
    <div class="custom-name-row" id="custom-name-row">
      <label style="min-width:90px; font-size:.84rem; font-weight:500; color:var(--sub);">Custom name</label>
      <input type="text" id="opt-custom-name" placeholder="e.g. Vacation">
    </div>

    <div class="opt-row">
      <label>Date position</label>
      <div class="seg-group" id="pos-group">
        <button class="seg-btn active" onclick="setPos('after')">After</button>
        <button class="seg-btn" onclick="setPos('before')">Before</button>
      </div>
    </div>

    <div class="checks">
      <label class="check-row">
        <input type="checkbox" id="opt-time">
        Include time (HH-MM-SS)
      </label>
      <label class="check-row">
        <input type="checkbox" id="opt-recursive">
        Recursive — include subfolders
      </label>
      <label class="check-row">
        <input type="checkbox" id="opt-dryrun">
        Dry run — preview only, no download
      </label>
    </div>
  </div>

  <!-- Actions -->
  <div class="card">
    <div class="action-bar">
      <button class="btn btn-primary" id="run-btn" onclick="run()" disabled>Rename &amp; Download</button>
      <button class="btn btn-ghost" onclick="resetAll()">Clear</button>
    </div>
    <div class="progress-wrap" id="progress-wrap">
      <div class="progress-bg"><div class="progress-fill" id="progress-fill"></div></div>
      <div class="progress-text" id="progress-text"></div>
    </div>
  </div>

  <!-- Success -->
  <div id="dl-section">
    <div class="dl-banner">
      <div>
        <div class="dl-msg" id="dl-msg">Done</div>
        <div class="dl-sub" id="dl-sub"></div>
      </div>
      <button class="btn btn-primary" id="dl-btn">⬇ Download again</button>
    </div>
  </div>

  <!-- Log -->
  <div class="card log-card">
    <div class="log-bar">
      <span>Output</span>
      <button onclick="clearLog()">Clear</button>
    </div>
    <div id="log"></div>
  </div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"
        integrity="sha512-XMVd28F1oH/O71fzwBnV7HucLxVwtxf26XV8P4wPk26EDxuGZ91N8bsOttmnomcCD3CS5ZMRL50H0GgOHvegtg=="
        crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script src="https://cdn.jsdelivr.net/npm/exifr@7/dist/full.umd.js"></script>
<script>

const IMAGE_EXTS = new Set(['.jpg', '.jpeg', '.png']);

// Each entry: { file, folderPath, originalName, relativePath? }
let selectedFiles = [];
let nameMode = 'keep';  // 'keep' | 'custom' | 'date'
let datePos  = 'after'; // 'after' | 'before'

// ── File selection ────────────────────────────────────────────────────────────

const dropzone    = document.getElementById('dropzone');
const fileInput   = document.getElementById('file-input');
const folderInput = document.getElementById('folder-input');

fileInput.addEventListener('change', e => {
  addEntries([...e.target.files].map(f => ({ file: f, folderPath: '', originalName: f.name })));
  e.target.value = '';
});

folderInput.addEventListener('change', e => {
  const entries = [...e.target.files]
    .filter(f => IMAGE_EXTS.has(getExt(f.name).toLowerCase()))
    .map(f => {
      const parts = f.webkitRelativePath.split('/');
      const folderPath = parts.length > 2 ? parts.slice(1, -1).join('/') : '';
      return { file: f, folderPath, originalName: f.name, relativePath: f.webkitRelativePath };
    });
  if (!entries.length) logLine('No image files found in the selected folder.', 'err');
  else addEntries(entries);
  e.target.value = '';
});

dropzone.addEventListener('dragover',  e => { e.preventDefault(); dropzone.classList.add('over'); });
dropzone.addEventListener('dragleave', e => { if (!dropzone.contains(e.relatedTarget)) dropzone.classList.remove('over'); });
dropzone.addEventListener('drop', e => {
  e.preventDefault();
  dropzone.classList.remove('over');
  const imgs = [...e.dataTransfer.files].filter(f => IMAGE_EXTS.has(getExt(f.name).toLowerCase()));
  if (!imgs.length) { logLine('No image files (.jpg, .jpeg, .png) in drop.', 'err'); return; }
  addEntries(imgs.map(f => ({ file: f, folderPath: '', originalName: f.name })));
});

function addEntries(entries) {
  const seen = new Set(selectedFiles.map(e => e.folderPath + '/' + e.originalName));
  for (const entry of entries) {
    const key = entry.folderPath + '/' + entry.originalName;
    if (!seen.has(key)) { selectedFiles.push(entry); seen.add(key); }
  }
  renderFileList();
  updateRunBtn();
}

function removeFile(idx) {
  selectedFiles.splice(idx, 1);
  renderFileList();
  updateRunBtn();
}

function renderFileList() {
  document.getElementById('file-list').innerHTML = selectedFiles.map((e, i) => `
    <div class="chip">
      ${escHtml(e.originalName)}
      <button title="Remove" onclick="removeFile(${i})">✕</button>
    </div>`).join('');
}

function updateRunBtn() {
  document.getElementById('run-btn').disabled = selectedFiles.length === 0;
}

// ── Option controls ───────────────────────────────────────────────────────────

function setNameMode(mode) {
  nameMode = mode;
  document.querySelectorAll('#name-mode-group .seg-btn').forEach((btn, i) =>
    btn.classList.toggle('active', ['keep','custom','date'][i] === mode));
  document.getElementById('custom-name-row').classList.toggle('visible', mode === 'custom');
}

function setPos(pos) {
  datePos = pos;
  document.querySelectorAll('#pos-group .seg-btn').forEach((btn, i) =>
    btn.classList.toggle('active', ['after','before'][i] === pos));
}

// ── Rename logic (faithful port from photodate.py) ────────────────────────────

function getExt(filename) {
  const i = filename.lastIndexOf('.');
  return i >= 0 ? filename.slice(i) : '';
}

function getStem(filename) {
  const ext = getExt(filename);
  return ext ? filename.slice(0, -ext.length) : filename;
}

function makeDatetimeString(dt, addTime, sep) {
  const pad = n => String(n).padStart(2, '0');
  const date = `${dt.getFullYear()}-${pad(dt.getMonth()+1)}-${pad(dt.getDate())}`;
  if (addTime) return `${date}${sep}${pad(dt.getHours())}-${pad(dt.getMinutes())}-${pad(dt.getSeconds())}`;
  return date;
}

function makeTargetStem(originalStem, datetimeStr, sep, mode, customName, dateBefore) {
  // mode 'date': use only datetime (--replace-name with no value)
  // mode 'custom': use customName as base (--replace-name SomeName)
  // mode 'keep': keep original stem (no --replace-name)
  if (mode === 'date') return datetimeStr;
  const base = mode === 'custom' ? customName : originalStem;
  return dateBefore ? `${datetimeStr}${sep}${base}` : `${base}${sep}${datetimeStr}`;
}

function chooseAvailableName(folderPath, stem, ext, reservedPaths, originalName) {
  const makeKey = s => `${folderPath}::${s}${ext}`;
  const origKey = `${folderPath}::${originalName}`;

  let key = makeKey(stem);
  if (!reservedPaths.has(key) || key === origKey) { reservedPaths.add(key); return `${stem}${ext}`; }

  for (let n = 1; ; n++) {
    key = makeKey(`${stem}_${n}`);
    if (!reservedPaths.has(key) || key === origKey) { reservedPaths.add(key); return `${stem}_${n}${ext}`; }
  }
}

async function buildPlan(entries, opts) {
  const { addTime, separator, recursive, dateBefore } = opts;
  const items = [];

  for (const entry of entries) {
    // Skip subfolders when not recursive
    if (!recursive && entry.folderPath !== '') continue;

    let dt = null;
    try {
      const exif = await exifr.parse(entry.file, { pick: ['DateTimeOriginal'] });
      dt = (exif && exif.DateTimeOriginal instanceof Date && !isNaN(exif.DateTimeOriginal))
        ? exif.DateTimeOriginal : null;
    } catch (_) {}

    if (!dt) { logLine(`No EXIF date: ${entry.originalName}`, 'err'); continue; }

    const stem        = getStem(entry.originalName);
    const ext         = getExt(entry.originalName);
    const datetimeStr = makeDatetimeString(dt, addTime, separator);
    const targetStem  = makeTargetStem(stem, datetimeStr, separator, opts.nameMode, opts.customName, dateBefore);

    items.push({
      entry,
      folderPath: entry.folderPath || '',
      ext,
      extKey: ext.toLowerCase(),
      dt,
      originalNameKey: entry.originalName.toLowerCase(),
      targetStem,
    });
  }

  // Group files that would produce the same visible target name (same folder + stem + ext)
  const groups = new Map();
  for (const item of items) {
    const key = `${item.folderPath}|${item.targetStem}|${item.extKey}`;
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(item);
  }

  const reservedPaths = new Set();
  const plan = [];

  for (const key of [...groups.keys()].sort()) {
    const group = groups.get(key);
    // Sort by EXIF datetime, then original filename (matches Python's sort)
    group.sort((a, b) => a.dt - b.dt || a.originalNameKey.localeCompare(b.originalNameKey));

    if (group.length === 1) {
      const item = group[0];
      const newName = chooseAvailableName(item.folderPath, item.targetStem, item.ext, reservedPaths, item.entry.originalName);
      plan.push({ item, newName });
    } else {
      for (let i = 0; i < group.length; i++) {
        const item = group[i];
        const newName = chooseAvailableName(item.folderPath, `${item.targetStem}_${i+1}`, item.ext, reservedPaths, item.entry.originalName);
        plan.push({ item, newName });
      }
    }
  }

  // Final sort: chronological, then original filename
  plan.sort((a, b) => a.item.dt - b.item.dt || a.item.originalNameKey.localeCompare(b.item.originalNameKey));

  return plan;
}

// ── Run ───────────────────────────────────────────────────────────────────────

async function run() {
  if (!selectedFiles.length) return;

  const separator  = document.getElementById('opt-separator').value || '_';
  const addTime    = document.getElementById('opt-time').checked;
  const recursive  = document.getElementById('opt-recursive').checked;
  const dryRun     = document.getElementById('opt-dryrun').checked;
  const customName = document.getElementById('opt-custom-name').value.trim();

  const runBtn = document.getElementById('run-btn');
  runBtn.disabled = true;
  runBtn.innerHTML = '<div class="spinner"></div> Processing…';
  setProgress(true, 0, 'Reading EXIF data…');
  document.getElementById('dl-section').classList.remove('visible');
  logLine('─'.repeat(44), 'muted');

  const opts = { addTime, separator, recursive, dateBefore: datePos === 'before', nameMode, customName };
  const plan = await buildPlan(selectedFiles, opts);

  if (!plan.length) {
    logLine('No files to rename.', 'err');
    finish(runBtn); return;
  }

  let renamed = 0, alreadyOk = 0;

  if (dryRun) {
    logLine('[Dry run] Rename plan:', 'head');
    for (const { item, newName } of plan) {
      if (item.entry.originalName === newName) { logLine(`  Already named: ${item.entry.originalName}`, 'muted'); alreadyOk++; }
      else                                      { logLine(`  ${item.entry.originalName} → ${newName}`, 'ok'); renamed++; }
    }
    logLine(`\n${renamed} rename(s) planned, ${alreadyOk} already correct.`, 'ok');
    finish(runBtn); return;
  }

  setProgress(true, 10, 'Building ZIP…');
  const zip = new JSZip();

  for (let i = 0; i < plan.length; i++) {
    const { item, newName } = plan[i];
    setProgress(true, 10 + Math.round((i / plan.length) * 80), `${i+1} / ${plan.length} — ${item.entry.originalName}`);

    if (item.entry.originalName === newName) {
      logLine(`Already named: ${item.entry.originalName}`, 'muted');
      alreadyOk++;
    } else {
      logLine(`${item.entry.originalName} → ${newName}`, 'ok');
      renamed++;
    }

    const zipPath = item.folderPath ? `${item.folderPath}/${newName}` : newName;
    zip.file(zipPath, item.entry.file);
  }

  setProgress(true, 95, 'Generating archive…');
  const blob    = await zip.generateAsync({ type: 'blob' });
  const outName = 'renamed-photos.zip';

  document.getElementById('dl-btn').onclick = () => downloadBlob(blob, outName);
  document.getElementById('dl-msg').textContent = `${renamed} renamed, ${alreadyOk} already correct`;
  document.getElementById('dl-sub').textContent  = outName;
  document.getElementById('dl-section').classList.add('visible');
  downloadBlob(blob, outName);

  logLine(`\n${renamed} file(s) renamed.`, 'ok');
  finish(runBtn);
}

// ── Helpers ───────────────────────────────────────────────────────────────────

function finish(runBtn) {
  setProgress(false);
  runBtn.disabled = false;
  runBtn.innerHTML = 'Rename &amp; Download';
}

function downloadBlob(blob, filename) {
  const url = URL.createObjectURL(blob);
  const a = Object.assign(document.createElement('a'), { href: url, download: filename });
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 5000);
}

function setProgress(visible, pct, text) {
  document.getElementById('progress-wrap').classList.toggle('visible', visible);
  if (visible) {
    document.getElementById('progress-fill').style.width = (pct || 0) + '%';
    document.getElementById('progress-text').textContent = text || '';
  }
}

function logLine(msg, cls) {
  const log  = document.getElementById('log');
  const line = document.createElement('div');
  if (cls) line.className = cls;
  line.textContent = msg;
  log.appendChild(line);
  log.scrollTop = log.scrollHeight;
}

function clearLog() { document.getElementById('log').innerHTML = ''; }

function resetAll() {
  selectedFiles = [];
  renderFileList();
  updateRunBtn();
  clearLog();
  setNameMode('keep');
  setPos('after');
  document.getElementById('opt-separator').value    = '_';
  document.getElementById('opt-time').checked       = false;
  document.getElementById('opt-recursive').checked  = false;
  document.getElementById('opt-dryrun').checked     = false;
  document.getElementById('opt-custom-name').value  = '';
  document.getElementById('dl-section').classList.remove('visible');
  setProgress(false);
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
</script>
</body>
